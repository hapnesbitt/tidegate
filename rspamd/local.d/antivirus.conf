clamav {
  type = "clamav";
  servers = "clamav:3310";
  symbol = "CLAM_VIRUS";          # a scan error adds CLAM_VIRUS_FAIL; Tidegate's fail_mode decides what happens then
  scan_mime_parts = true;
  scan_text_mime = false;
  scan_image_mime = false;
  max_size = 26214400;
  timeout = 15;
  retransmits = 1;
  action = "reject";
  log_clean = false;
}
