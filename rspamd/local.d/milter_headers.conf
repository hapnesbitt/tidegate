# Headers Tidegate adds to delivered mail. Copies of these that arrive from outside are removed first.
use = ["authentication-results", "x-spamd-result"];
skip_local = false;
skip_authenticated = false;
routines {
  authentication-results {
    header = "Authentication-Results";
    remove = 0;
    add_smtp_user = false;
  }
  x-spamd-result {
    header = "X-Spamd-Result";
    remove = 0;
  }
}
