# ClamAV daemon settings for Tidegate: the official image's defaults plus the lines marked "Tidegate".
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav
# Tidegate: reload signatures in place. The default loads a second copy first, which doubles memory (about 2.6 GB)
# for a minute after each update; scans then wait for that minute instead, and Postfix retries.
ConcurrentDatabaseReload no
# Tidegate: match the 25 MB message limit.
StreamMaxLength 26M
MaxFileSize 25M
MaxScanSize 100M
