server:
  interface: 0.0.0.0
  port: 53
  do-ip6: no
  # Only containers on the stack's private network can reach this resolver (it publishes no port).
  access-control: 0.0.0.0/0 allow
  username: "unbound"
  directory: "/etc/unbound"
  chroot: ""
  pidfile: ""
  use-syslog: no
  logfile: ""
  verbosity: 0
  root-hints: "/usr/share/dns-root-hints/named.root"
  auto-trust-anchor-file: "/var/lib/unbound/root.key"
  hide-identity: yes
  hide-version: yes
  qname-minimisation: yes
  prefetch: yes
  num-threads: 1
  msg-cache-size: 16m
  rrset-cache-size: 32m
