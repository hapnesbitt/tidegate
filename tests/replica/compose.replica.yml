# The edge Postfix for the replica test, on the lab network with a fixed address (no host port).
services:
  edge:
    image: tidegate:0.1.0
    entrypoint: ["/bin/sh", "/edge/start.sh"]
    hostname: mail.arc-codex.test
    environment:
      MODE: ${EDGE_MODE:-tidegate}
    volumes:
      - ./tests/replica/edge:/edge:ro
    networks:
      tidegate:
        ipv4_address: 172.31.241.20
